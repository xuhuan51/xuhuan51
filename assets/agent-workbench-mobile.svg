<svg xmlns="http://www.w3.org/2000/svg" width="430" height="520" viewBox="0 0 430 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent systems workbench for mobile</title>
  <desc id="desc">A compact animated view of an agent trace and an LLM serving pipeline.</desc>

  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --green: #1f883d;
      --green-soft: #dafbe1;
      --blue: #0969da;
      --blue-soft: #ddf4ff;
      --violet: #8250df;
      --violet-soft: #fbefff;
      --amber: #9a6700;
      --amber-soft: #fff8c5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #0d1117;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --green: #3fb950;
        --green-soft: #12261e;
        --blue: #58a6ff;
        --blue-soft: #10243e;
        --violet: #bc8cff;
        --violet-soft: #271a3b;
        --amber: #d29922;
        --amber-soft: #2d250f;
      }
    }

    text {
      fill: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
    }

    .muted { fill: var(--muted); }
    .green { fill: var(--green); }
    .blue { fill: var(--blue); }
    .violet { fill: var(--violet); }
    .amber { fill: var(--amber); }

    .node {
      animation: pulse 3.2s ease-in-out infinite;
      transform-origin: center;
    }

    .node.d1 { animation-delay: 0.8s; }
    .node.d2 { animation-delay: 1.6s; }
    .node.d3 { animation-delay: 2.4s; }

    .bar {
      animation: load 2.7s ease-in-out infinite alternate;
      transform-origin: left center;
    }

    .bar.d1 { animation-delay: 0.6s; }
    .bar.d2 { animation-delay: 1.2s; }

    .blink { animation: blink 0.9s steps(1) infinite; }
    .status { animation: status 2s ease-in-out infinite; transform-origin: center; }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.94); }
      45%, 65% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes load {
      from { transform: scaleX(0.55); }
      to { transform: scaleX(1); }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes status {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <rect x="1" y="1" width="428" height="518" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <rect x="1" y="1" width="428" height="40" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
  <path d="M1 33 H429" stroke="var(--panel)" stroke-width="12"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="20" r="5" fill="#febc2e"/>
  <circle cx="54" cy="20" r="5" fill="#28c840"/>
  <text x="73" y="24" class="muted" font-size="11">~/agent-systems</text>
  <circle class="status" cx="318" cy="20" r="4" fill="var(--green)"/>
  <text x="329" y="24" class="green" font-size="9">OPEN TO WORK</text>

  <g>
    <rect x="16" y="55" width="398" height="205" rx="7" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
    <rect x="16" y="55" width="398" height="33" rx="7" fill="var(--panel-2)"/>
    <path d="M16 82 H414" stroke="var(--border)"/>
    <circle cx="34" cy="71" r="4" fill="var(--green)"/>
    <text x="47" y="75" font-size="11" font-weight="700">AGENT TRACE</text>
    <text x="354" y="75" class="green" font-size="9">RUNNING</text>

    <path d="M66 124 H129 M167 124 H230 M268 124 H356" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
    <circle class="node" cx="54" cy="124" r="11" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
    <circle class="node d1" cx="148" cy="124" r="11" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2"/>
    <circle class="node d2" cx="249" cy="124" r="11" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="2"/>
    <circle class="node d3" cx="375" cy="124" r="11" fill="var(--green-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="54" y="151" text-anchor="middle" class="blue" font-size="9">PLAN</text>
    <text x="148" y="151" text-anchor="middle" class="violet" font-size="9">TOOL</text>
    <text x="249" y="151" text-anchor="middle" class="amber" font-size="9">VERIFY</text>
    <text x="375" y="151" text-anchor="middle" class="green" font-size="9">ANSWER</text>

    <rect x="35" y="172" width="360" height="27" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <text x="48" y="190" class="muted" font-size="10">tool.call</text>
    <text x="125" y="190" font-size="10">query_metrics</text>
    <text x="361" y="190" class="green" font-size="9">OK</text>

    <rect x="35" y="207" width="360" height="27" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <text x="48" y="225" class="muted" font-size="10">evidence</text>
    <text x="125" y="225" font-size="10">logs + traces</text>
    <rect class="blink" x="371" y="214" width="3" height="13" fill="var(--blue)"/>
    <text x="35" y="250" class="green" font-size="9">✓ grounded response with evidence</text>
  </g>

  <g>
    <rect x="16" y="276" width="398" height="188" rx="7" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
    <rect x="16" y="276" width="398" height="33" rx="7" fill="var(--panel-2)"/>
    <path d="M16 303 H414" stroke="var(--border)"/>
    <circle cx="34" cy="292" r="4" fill="var(--blue)"/>
    <text x="47" y="296" font-size="11" font-weight="700">LLM SERVING</text>
    <text x="357" y="296" class="blue" font-size="9">HEALTHY</text>

    <text x="35" y="331" class="muted" font-size="9">SCHEDULER</text>
    <rect x="111" y="320" width="284" height="18" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <rect x="119" y="325" width="62" height="8" rx="3" fill="var(--blue)"/>
    <rect x="188" y="325" width="51" height="8" rx="3" fill="var(--violet)"/>
    <rect x="246" y="325" width="78" height="8" rx="3" fill="var(--green)"/>

    <text x="35" y="368" class="muted" font-size="9">KV CACHE</text>
    <rect x="111" y="357" width="284" height="18" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <rect x="113" y="359" width="210" height="14" rx="4" fill="var(--green)"/>
    <path d="M165 359 V373 M217 359 V373 M269 359 V373" stroke="var(--panel)" opacity="0.65"/>

    <text x="35" y="406" class="muted" font-size="9">GPU 0</text>
    <rect x="111" y="396" width="284" height="10" rx="3" fill="var(--panel-2)"/>
    <rect class="bar" x="111" y="396" width="256" height="10" rx="3" fill="var(--blue)"/>

    <text x="35" y="430" class="muted" font-size="9">GPU 1</text>
    <rect x="111" y="420" width="284" height="10" rx="3" fill="var(--panel-2)"/>
    <rect class="bar d1" x="111" y="420" width="232" height="10" rx="3" fill="var(--violet)"/>

    <text x="35" y="454" class="muted" font-size="9">GPU 2</text>
    <rect x="111" y="444" width="284" height="10" rx="3" fill="var(--panel-2)"/>
    <rect class="bar d2" x="111" y="444" width="270" height="10" rx="3" fill="var(--green)"/>
  </g>

  <rect x="16" y="480" width="398" height="25" rx="5" fill="var(--panel)" stroke="var(--border)"/>
  <text x="28" y="496" class="blue" font-size="10">&gt;_</text>
  <text x="56" y="496" class="violet" font-size="9">AGENT</text>
  <text x="102" y="496" class="muted" font-size="9">→</text>
  <text x="120" y="496" class="amber" font-size="9">TOOLS</text>
  <text x="165" y="496" class="muted" font-size="9">→</text>
  <text x="183" y="496" class="blue" font-size="9">MODEL</text>
  <text x="228" y="496" class="muted" font-size="9">→</text>
  <text x="246" y="496" class="green" font-size="9">ANSWER</text>
  <circle class="status" cx="388" cy="492" r="5" fill="var(--green)"/>
</svg>
