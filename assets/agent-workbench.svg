<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Agent systems workbench</title>
  <desc id="desc">An animated dual-screen workbench. The left screen shows an agent trace and the right screen shows an LLM serving pipeline.</desc>

  <style>
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --green: #1f883d;
      --green-soft: #dafbe1;
      --blue: #0969da;
      --blue-soft: #ddf4ff;
      --violet: #8250df;
      --violet-soft: #fbefff;
      --amber: #9a6700;
      --amber-soft: #fff8c5;
      --desk: #d4a373;
      --desk-edge: #a47148;
      --hoodie: #dbeafe;
      --hoodie-line: #60a5fa;
      --hair: #3d2b1f;
      --skin: #e7b98d;
      --shadow: #afb8c1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #0d1117;
        --border: #30363d;
        --text: #f0f6fc;
        --muted: #8b949e;
        --green: #3fb950;
        --green-soft: #12261e;
        --blue: #58a6ff;
        --blue-soft: #10243e;
        --violet: #bc8cff;
        --violet-soft: #271a3b;
        --amber: #d29922;
        --amber-soft: #2d250f;
        --desk: #684b35;
        --desk-edge: #3f2f24;
        --hoodie: #172b4d;
        --hoodie-line: #58a6ff;
        --hair: #211a17;
        --skin: #bd8b68;
        --shadow: #30363d;
      }
    }

    text {
      fill: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
    }

    .muted { fill: var(--muted); }
    .green { fill: var(--green); }
    .blue { fill: var(--blue); }
    .violet { fill: var(--violet); }
    .amber { fill: var(--amber); }

    .trace-pulse {
      animation: tracePulse 3.6s ease-in-out infinite;
      transform-origin: center;
    }

    .trace-pulse.delay-1 { animation-delay: 0.9s; }
    .trace-pulse.delay-2 { animation-delay: 1.8s; }
    .trace-pulse.delay-3 { animation-delay: 2.7s; }

    .queue-row {
      animation: queueFlow 4s ease-in-out infinite;
    }

    .queue-row.delay-1 { animation-delay: 0.65s; }
    .queue-row.delay-2 { animation-delay: 1.3s; }

    .gpu-bar {
      animation: gpuLoad 2.8s ease-in-out infinite alternate;
      transform-origin: left center;
    }

    .gpu-bar.delay-1 { animation-delay: 0.45s; }
    .gpu-bar.delay-2 { animation-delay: 0.9s; }
    .gpu-bar.delay-3 { animation-delay: 1.35s; }

    .cursor {
      animation: blink 0.9s steps(1) infinite;
    }

    .status-dot {
      animation: statusPulse 2s ease-in-out infinite;
      transform-origin: center;
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes tracePulse {
      0%, 100% { opacity: 0.42; transform: scale(0.96); }
      28%, 58% { opacity: 1; transform: scale(1.06); }
    }

    @keyframes queueFlow {
      0%, 100% { transform: translateX(0); opacity: 0.55; }
      45%, 70% { transform: translateX(22px); opacity: 1; }
    }

    @keyframes gpuLoad {
      0% { transform: scaleX(0.55); }
      100% { transform: scaleX(1); }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.86); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <rect x="1" y="1" width="998" height="428" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>

  <rect x="1" y="1" width="998" height="42" rx="8" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
  <path d="M1 35 H999" stroke="var(--panel)" stroke-width="14"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="88" y="27" class="muted" font-size="13">~/agent-systems</text>
  <circle class="status-dot" cx="858" cy="22" r="5" fill="var(--green)"/>
  <text x="872" y="27" class="green" font-size="12">OPEN TO WORK</text>

  <g id="left-monitor">
    <rect x="62" y="72" width="360" height="230" rx="7" fill="var(--shadow)" opacity="0.35"/>
    <rect x="55" y="65" width="360" height="230" rx="7" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
    <rect x="55" y="65" width="360" height="34" rx="7" fill="var(--panel-2)"/>
    <path d="M55 92 H415" stroke="var(--border)"/>
    <circle cx="74" cy="82" r="4" fill="var(--green)"/>
    <text x="88" y="87" font-size="12" font-weight="700">AGENT TRACE</text>
    <text x="327" y="87" class="green" font-size="10">RUNNING</text>

    <path d="M100 137 H174 M215 137 H282 M323 137 H372" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
    <circle class="trace-pulse" cx="88" cy="137" r="12" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
    <circle class="trace-pulse delay-1" cx="194" cy="137" r="12" fill="var(--violet-soft)" stroke="var(--violet)" stroke-width="2"/>
    <circle class="trace-pulse delay-2" cx="303" cy="137" r="12" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="2"/>
    <circle class="trace-pulse delay-3" cx="384" cy="137" r="12" fill="var(--green-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="88" y="165" text-anchor="middle" class="blue" font-size="10">PLAN</text>
    <text x="194" y="165" text-anchor="middle" class="violet" font-size="10">TOOL</text>
    <text x="303" y="165" text-anchor="middle" class="amber" font-size="10">VERIFY</text>
    <text x="384" y="165" text-anchor="middle" class="green" font-size="10">ANSWER</text>

    <rect x="78" y="188" width="314" height="26" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <text x="90" y="205" class="muted" font-size="10">tool.call</text>
    <text x="164" y="205" font-size="10">query_metrics</text>
    <text x="342" y="205" class="green" font-size="10">OK</text>

    <rect x="78" y="222" width="314" height="26" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
    <text x="90" y="239" class="muted" font-size="10">evidence</text>
    <text x="164" y="239" font-size="10">logs + traces</text>
    <rect class="cursor" x="370" y="229" width="3" height="12" fill="var(--blue)"/>

    <text x="78" y="273" class="green" font-size="10">✓ grounded response with evidence</text>

    <path d="M205 295 V319 H265 V295" fill="var(--shadow)" opacity="0.75"/>
    <rect x="162" y="316" width="146" height="10" rx="5" fill="var(--shadow)"/>
  </g>

  <g id="right-monitor">
    <rect x="592" y="72" width="350" height="230" rx="7" fill="var(--shadow)" opacity="0.35"/>
    <rect x="585" y="65" width="350" height="230" rx="7" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/>
    <rect x="585" y="65" width="350" height="34" rx="7" fill="var(--panel-2)"/>
    <path d="M585 92 H935" stroke="var(--border)"/>
    <circle cx="604" cy="82" r="4" fill="var(--blue)"/>
    <text x="618" y="87" font-size="12" font-weight="700">LLM SERVING</text>
    <text x="858" y="87" class="blue" font-size="10">HEALTHY</text>

    <text x="610" y="122" class="muted" font-size="10">SCHEDULER QUEUE</text>
    <g transform="translate(610 133)">
      <rect width="276" height="24" rx="5" fill="var(--panel-2)" stroke="var(--border)"/>
      <rect class="queue-row" x="8" y="6" width="62" height="12" rx="4" fill="var(--blue)"/>
      <rect class="queue-row delay-1" x="82" y="6" width="48" height="12" rx="4" fill="var(--violet)"/>
      <rect class="queue-row delay-2" x="142" y="6" width="70" height="12" rx="4" fill="var(--green)"/>
    </g>

    <text x="610" y="184" class="muted" font-size="10">KV CACHE</text>
    <rect x="610" y="194" width="276" height="14" rx="4" fill="var(--panel-2)" stroke="var(--border)"/>
    <rect x="612" y="196" width="188" height="10" rx="3" fill="var(--green)"/>
    <path d="M660 196 V206 M708 196 V206 M756 196 V206" stroke="var(--panel)" opacity="0.65"/>
    <text x="894" y="205" class="green" font-size="9">READY</text>

    <text x="610" y="233" class="muted" font-size="10">GPU WORKERS</text>
    <g transform="translate(610 243)">
      <text x="0" y="9" class="muted" font-size="9">0</text>
      <rect x="18" y="0" width="240" height="9" rx="3" fill="var(--panel-2)"/>
      <rect class="gpu-bar" x="18" y="0" width="220" height="9" rx="3" fill="var(--blue)"/>

      <text x="0" y="27" class="muted" font-size="9">1</text>
      <rect x="18" y="18" width="240" height="9" rx="3" fill="var(--panel-2)"/>
      <rect class="gpu-bar delay-1" x="18" y="18" width="196" height="9" rx="3" fill="var(--violet)"/>

      <text x="0" y="45" class="muted" font-size="9">2</text>
      <rect x="18" y="36" width="240" height="9" rx="3" fill="var(--panel-2)"/>
      <rect class="gpu-bar delay-2" x="18" y="36" width="232" height="9" rx="3" fill="var(--green)"/>
    </g>

    <path d="M735 295 V319 H795 V295" fill="var(--shadow)" opacity="0.75"/>
    <rect x="692" y="316" width="146" height="10" rx="5" fill="var(--shadow)"/>
  </g>

  <g id="developer" class="float">
    <ellipse cx="500" cy="400" rx="132" ry="14" fill="var(--shadow)" opacity="0.35"/>
    <path d="M438 352 C440 310 458 283 500 283 C542 283 560 310 562 352 L574 405 H426 Z" fill="var(--hoodie)" stroke="var(--hoodie-line)" stroke-width="2"/>
    <path d="M466 301 C475 318 525 318 534 301" fill="none" stroke="var(--hoodie-line)" stroke-width="2"/>
    <path d="M474 321 L467 381 M526 321 L533 381" stroke="var(--hoodie-line)" stroke-width="2" opacity="0.65"/>
    <circle cx="500" cy="258" r="34" fill="var(--skin)"/>
    <path d="M467 260 C466 224 484 211 510 216 C535 220 541 240 531 264 C524 247 514 237 496 236 C484 236 475 244 467 260 Z" fill="var(--hair)"/>
    <path d="M468 251 C456 260 456 279 470 285" fill="none" stroke="var(--hair)" stroke-width="8" stroke-linecap="round"/>
    <path d="M532 251 C544 260 544 279 530 285" fill="none" stroke="var(--hair)" stroke-width="8" stroke-linecap="round"/>
    <rect x="457" y="255" width="10" height="29" rx="5" fill="var(--blue)"/>
    <rect x="533" y="255" width="10" height="29" rx="5" fill="var(--blue)"/>
  </g>

  <rect x="28" y="365" width="944" height="34" rx="6" fill="var(--panel)" stroke="var(--border)"/>
  <text x="51" y="386" class="blue" font-size="12">&gt;_</text>
  <text x="86" y="386" class="muted" font-size="11">USER</text>
  <text x="139" y="386" class="muted" font-size="11">→</text>
  <text x="165" y="386" class="violet" font-size="11">AGENT</text>
  <text x="226" y="386" class="muted" font-size="11">→</text>
  <text x="252" y="386" class="amber" font-size="11">TOOLS</text>
  <text x="313" y="386" class="muted" font-size="11">→</text>
  <text x="339" y="386" class="blue" font-size="11">MODEL</text>
  <text x="400" y="386" class="muted" font-size="11">→</text>
  <text x="426" y="386" class="green" font-size="11">ANSWER</text>

  <path id="token-path" d="M520 381 C610 381 646 381 720 381 C782 381 828 381 904 381" fill="none"/>
  <circle r="6" fill="var(--green)">
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#token-path"/>
    </animateMotion>
  </circle>
  <text x="932" y="386" class="green" text-anchor="end" font-size="10">SYSTEM READY</text>
</svg>
